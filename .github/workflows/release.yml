name: Create GitHub release for a tag

# The tag push handles this by itself (see publish.yml). This is for tags that
# were pushed before that existed — v1.0.0 through v1.1.2 published to the
# registry and left the Releases page empty. Run it once per old tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for, e.g. v1.1.2"
        required: true

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Refuse to publish a release twice
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Delete it first if you meant to replace it."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          bash scripts/release_notes.sh "$TAG" > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
