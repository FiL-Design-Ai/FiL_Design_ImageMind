name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout FiL_Design_ImageMind
        uses: actions/checkout@v4
        with:
          path: fil-design-imagemind-temp

      - name: Checkout ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI
          fetch-depth: 1
          filter: blob:none

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            fil-design-imagemind-temp/requirements.txt
            fil-design-imagemind-temp/requirements-dev.txt
            ComfyUI/requirements.txt

      - name: Install CPU-only PyTorch
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install ComfyUI dependencies
        run: pip install -r ComfyUI/requirements.txt

      - name: Install FiL_Design_ImageMind dependencies
        # requirements-dev.txt pulls in requirements.txt and the test runner;
        # neither ComfyUI's requirements nor ours ship pytest.
        run: pip install -r fil-design-imagemind-temp/requirements-dev.txt

      - name: Move FiL_Design_ImageMind into ComfyUI custom_nodes
        run: |
          mkdir -p ComfyUI/custom_nodes
          mv fil-design-imagemind-temp ComfyUI/custom_nodes/FiL_Design_ImageMind

      - name: Run Python tests
        working-directory: ComfyUI/custom_nodes/FiL_Design_ImageMind
        run: python -m pytest tests/ -v --tb=short -q

      - name: Release preflight
        working-directory: ComfyUI/custom_nodes/FiL_Design_ImageMind
        run: python tools/preflight_check.py

      - name: Scan for node-id conflicts
        working-directory: ComfyUI/custom_nodes/FiL_Design_ImageMind
        run: python tools/scan_node_conflicts.py

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check & build
        working-directory: frontend
        run: npm run build

      # `frontend/dist` is committed — ComfyUI loads it through WEB_DIRECTORY
      # and the registry publish ships whatever is in git. A source change
      # without a rebuild ships the old bundle, and every other check here
      # would still pass.
      # Scoped to the bundle, not the sourcemap: the map is the likelier of the
      # two to differ over something that does not change what ships.
      - name: Check the committed bundle matches the source
        run: git diff --exit-code -- frontend/dist/fil_design_imagemind.js

      - name: Run frontend tests
        working-directory: frontend
        # The github-actions reporter turns failures into annotations, which are
        # readable on the run page without opening the raw log.
        run: npx vitest run --reporter=default --reporter=github-actions

      # The e2e suite has been in the repo since before 1.0.0 and never ran
      # anywhere but a developer's machine. It drives the widgets in a real
      # browser, which is the only place their DOM behaviour is real.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        # The dev server is started by the config's `webServer`, not here.
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Everything above tests one side of the seam. This one puts the pack in a
  # real ComfyUI and opens every node on one canvas — where a node that fails
  # to register, a panel that never mounts, or a hook that throws on a cold
  # load actually shows up. That gap is where the defects users reported lived.
  smoke-comfyui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FiL_Design_ImageMind
        uses: actions/checkout@v4
        with:
          path: fil-design-imagemind-temp

      - name: Checkout ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI
          fetch-depth: 1
          filter: blob:none

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fil-design-imagemind-temp/requirements.txt
            ComfyUI/requirements.txt

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fil-design-imagemind-temp/frontend/package-lock.json

      - name: Install CPU-only PyTorch
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install ComfyUI dependencies
        run: pip install -r ComfyUI/requirements.txt

      - name: Install FiL_Design_ImageMind dependencies
        run: pip install -r fil-design-imagemind-temp/requirements.txt

      - name: Move FiL_Design_ImageMind into ComfyUI custom_nodes
        run: |
          mkdir -p ComfyUI/custom_nodes
          mv fil-design-imagemind-temp ComfyUI/custom_nodes/FiL_Design_ImageMind

      - name: Install frontend dependencies
        working-directory: ComfyUI/custom_nodes/FiL_Design_ImageMind/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ComfyUI/custom_nodes/FiL_Design_ImageMind/frontend
        run: npx playwright install --with-deps chromium

      # The committed `frontend/dist` is served as-is: that is the bundle a
      # user installing from the registry actually gets. The build job above
      # is what proves it still matches the source.
      - name: Start ComfyUI
        working-directory: ComfyUI
        run: |
          python main.py --cpu --port 8188 --listen 127.0.0.1 > comfyui.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8188/ > /dev/null; then
              echo "ComfyUI is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ComfyUI did not start in 90s"
          cat comfyui.log
          exit 1

      - name: Run the ComfyUI smoke suite
        working-directory: ComfyUI/custom_nodes/FiL_Design_ImageMind/frontend
        env:
          COMFY_URL: http://127.0.0.1:8188
        run: npx playwright test -c playwright.comfy.config.ts

      - name: Show the ComfyUI log on failure
        if: failure()
        working-directory: ComfyUI
        run: cat comfyui.log

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: ComfyUI/custom_nodes/FiL_Design_ImageMind/frontend/playwright-report/
          retention-days: 7
