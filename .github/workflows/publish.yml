name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Creating the GitHub release writes to the repository; nothing else here
    # needs more than the read the checkout takes.
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # An unset secret expands to nothing, leaving `comfy node publish --token`
      # with no value — click rejects that as a usage error (exit 2) after the
      # frontend has already been built, and the log needs a login to read.
      - name: Check the registry token is present
        env:
          # The registry key was stored as FIL_DESIGN_IMAGEMIND; accept either
          # name so the canonical one keeps working if it is ever added.
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.FIL_DESIGN_IMAGEMIND }}
          # Names only — GitHub masks every secret value in logs and annotations.
          AVAILABLE: ${{ toJSON(secrets) }}
        run: |
          if [ -z "$TOKEN" ]; then
            NAMES=$(echo "$AVAILABLE" | grep -oE '"[^"]+":' | tr -d '":' | paste -sd, -)
            echo "::error::REGISTRY_ACCESS_TOKEN is empty or not set. Secrets this run can see: ${NAMES:-none}"
            exit 1
          fi
          echo "Registry token is set."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 1.1.0 and 1.1.1 are Flagged in the registry because the archive carried
      # the minified bundle with no map and no `src/` to read it against, and
      # the registry forbids unreviewable code. This job builds its own bundle,
      # so the repository test that guards the map cannot see the result.
      - name: Check the bundle ships a sourcemap
        run: |
          if [ ! -s frontend/dist/fil_design_imagemind.js.map ]; then
            echo "::error::frontend/dist/fil_design_imagemind.js.map is missing or empty. The registry would receive unreadable minified code and flag the version."
            exit 1
          fi
          echo "Sourcemap present ($(du -h frontend/dist/fil_design_imagemind.js.map | cut -f1))."

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.FIL_DESIGN_IMAGEMIND }}

      # A tag is only a marker on a commit; the Releases page stays empty until
      # something creates an entry. The notes are the CHANGELOG section for this
      # version, so the page says the same thing the repository does.
      # `gh` ships on the runner and signs in with the run's own token, so this
      # needs no third-party action and no extra secret. release.yml runs the
      # same script for tags pushed before any of this existed.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release_notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
