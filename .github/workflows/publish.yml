name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # An unset secret expands to nothing, leaving `comfy node publish --token`
      # with no value — click rejects that as a usage error (exit 2) after the
      # frontend has already been built, and the log needs a login to read.
      - name: Check the registry token is present
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::REGISTRY_ACCESS_TOKEN is empty or not set for this repository."
            exit 1
          fi
          echo "Registry token is set."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
