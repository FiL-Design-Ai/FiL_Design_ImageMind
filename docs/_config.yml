# GitHub Pages configuration
title: FiL_Design_ImageMind
description: AI-powered ComfyUI nodes for image analysis, prompt generation, and intelligent workflows
url: https://fil-design-ai.github.io/FiL_Design_ImageMind

# Theme. `jekyll-default` is not a real theme — Jekyll failed every Pages build
# with "The jekyll-default theme could not be found". index.html carries its own
# styling, so this only has to be a name GitHub Pages actually supports.
theme: jekyll-theme-primer

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown processor
markdown: kramdown

# Permalink style
permalink: /blog/:year/:month/:day/:title

# Collections
collections_dir: .

# Build settings
exclude:
  - .gitignore
  - README.md
  - package.json
  - node_modules

# GitHub Pages specific
github_url: https://github.com/FiL-Design-Ai/FiL_Design_ImageMind
