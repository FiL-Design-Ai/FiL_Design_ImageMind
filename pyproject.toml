[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FiL_Design_ImageMind"
version = "1.1.3"
description = "FiL Design ImageMind nodes for ComfyUI — image understanding and prompt generation (V3 API)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FiL-Design-Ai" }]
# Keep in step with requirements.txt — the registry reads this list, and a
# `[tool.setuptools.dynamic]` file reference would leave it empty there.
dependencies = [
  "requests>=2.31.0",
  "aiohttp>=3.9.0",
  "PyYAML>=6.0.1",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "pydantic>=2.0",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/FiL-Design-Ai/FiL_Design_ImageMind"

[tool.comfy]
requires-comfyui = ">=0.3.60"
PublisherId = "fil-design-ai"
DisplayName = "FiL_Design_ImageMind"
Icon = "https://raw.githubusercontent.com/FiL-Design-Ai/FiL_Design_ImageMind/main/frontend/public/fil_design_imagemind_logo.svg"

[tool.setuptools.package-dir]
FiL_Design_ImageMind = "."

[tool.setuptools.package-data]
FiL_Design_ImageMind = [
  # `config.yaml` is the user's own copy and is never shipped; the template is.
  "config.example.yaml",
  "data/locales/*.json",
  "frontend/dist/*",
  "frontend/dist/style-previews/*",
  "example_workflows/*.json",
]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
#
# There was no ruff config here before, which meant ruff run from inside a
# ComfyUI tree silently inherited ComfyUI's own rules from the parent directory,
# while the same command in CI — where the pack is checked out on its own — used
# ruff's defaults. Two different verdicts for the same code depending on where
# it sat. The rules below are the pack's own, so both agree.
#
# Deliberately no formatter. `.pre-commit-config.yaml` used to list ruff-format
# and black together with no settings for either, so they disagreed with each
# other and both wanted 88 columns in a project that reads at 120.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["_archive", "frontend", "logs", ".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "T"]
# E501 is left to the formatter that does not exist; the rest are idioms this
# codebase uses on purpose (bare except for best-effort host calls, imports
# after a sys.path fix-up in scripts).
ignore = ["E501", "E722", "E731", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
# `tools/` is command-line scripts. Printing is their output, not a leftover
# debug statement — the rule is aimed at the pack's runtime code, which has a
# logger and a user-settable log level.
"tools/*" = ["T201", "T203"]
"scripts/*" = ["T201", "T203"]
# Same again for the scratch scripts kept for reproducing a live issue by hand.
"scratch/*" = ["T201", "T203"]
