[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FiL_Design_ImageMind"
version = "1.1.0"
description = "FiL Design ImageMind nodes for ComfyUI — image understanding and prompt generation (V3 API)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FiL-Design-Ai" }]
requires-comfyui = ">=0.3.60"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/FiL-Design-Ai/FiL_Design_ImageMind"

[tool.comfy]
PublisherId = "fil-design-ai"
DisplayName = "FiL_Design_ImageMind"
Icon = "https://raw.githubusercontent.com/FiL-Design-Ai/FiL_Design_ImageMind/main/frontend/public/fil_design_imagemind_logo.svg"

[tool.setuptools.package-dir]
FiL_Design_ImageMind = "."

[tool.setuptools.package-data]
FiL_Design_ImageMind = [
  "config.yaml",
  "data/locales/*.json",
  "data/provider_vision_smoke.json",
  "frontend/dist/*",
  "frontend/dist/style-previews/*",
  "docs/workflows/*.json",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
